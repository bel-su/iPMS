name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nx affected needs history to diff against the base

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every service imports its own generated Prisma client from
      # `@prisma-clients/<service>`, which is written into that app's
      # node_modules and is not committed. Without this step nothing that
      # imports one can typecheck, build or run its tests -- CI was green only
      # when `nx affected` happened to exclude every such project, which made a
      # passing run mean very little.
      #
      # DATABASE_URL is required because each prisma.config.ts reads it, but its
      # value is irrelevant here: `generate` emits types and never connects.
      - name: Generate Prisma clients
        run: |
          for service in audit docs iam media notification project qc; do
            (cd "apps/$service" && DATABASE_URL=postgresql://codegen:codegen@127.0.0.1:5432/codegen pnpm exec prisma generate)
          done

      - name: Derive affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Lint
        run: pnpm nx affected -t lint --parallel=3

      - name: Typecheck
        run: pnpm nx affected -t typecheck --parallel=3

      - name: Test
        run: pnpm nx affected -t test --parallel=3 --coverage
        env:
          # Testcontainers uses the Docker daemon available on GitHub runners.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Build
        run: pnpm nx affected -t build --parallel=3

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [gateway, iam, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.service
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
