name: ipms

x-service-defaults: &service-defaults
  restart: unless-stopped
  environment: &service-env
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
    JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
  depends_on:
    postgres: { condition: service_healthy }
    nats:     { condition: service_healthy }
    redis:    { condition: service_healthy }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  iam:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: iam }
    environment:
      <<: *service-env
      PORT: 3001
      IAM_DATABASE_URL: postgresql://ipms_iam:ipms_iam@postgres:5432/ipms_iam
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  audit:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: audit }
    environment:
      <<: *service-env
      PORT: 3003
      AUDIT_DATABASE_URL: postgresql://ipms_audit:ipms_audit@postgres:5432/ipms_audit
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  project:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: project }
    environment:
      <<: *service-env
      PORT: 3004
      PROJECT_DATABASE_URL: postgresql://ipms_project:ipms_project@postgres:5432/ipms_project

  qc:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: qc }
    environment:
      <<: *service-env
      PORT: 3005
      QC_DATABASE_URL: postgresql://ipms_qc:ipms_qc@postgres:5432/ipms_qc

  gateway:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: gateway }
    environment:
      <<: *service-env
      PORT: 3000
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      iam:   { condition: service_healthy }
      audit: { condition: service_healthy }
      project: { condition: service_started }
      qc: { condition: service_started }

volumes:
  postgres-data:
  nats-data:
  redis-data:
  loki-data:
