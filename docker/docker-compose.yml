name: ipms

x-service-defaults: &service-defaults
  restart: unless-stopped

x-migrate-defaults: &migrate-defaults
  restart: "no"

services:
  postgres-iam:
    image: postgres:17-alpine
    env_file:
      - ./env/iam-db.env
    volumes:
      - postgres-iam-data:/var/lib/postgresql/data
    ports:
      - "${IAM_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipms_iam -d ipms_iam"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-audit:
    image: postgres:17-alpine
    env_file:
      - ./env/audit-db.env
    volumes:
      - postgres-audit-data:/var/lib/postgresql/data
    ports:
      - "${AUDIT_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipms_audit -d ipms_audit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-project:
    image: postgres:17-alpine
    env_file:
      - ./env/project-db.env
    volumes:
      - postgres-project-data:/var/lib/postgresql/data
    ports:
      - "${PROJECT_DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipms_project -d ipms_project"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-qc:
    image: postgres:17-alpine
    env_file:
      - ./env/qc-db.env
    volumes:
      - postgres-qc-data:/var/lib/postgresql/data
    ports:
      - "${QC_DB_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipms_qc -d ipms_qc"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-media:
    image: postgres:17-alpine
    env_file:
      - ./env/media-db.env
    volumes:
      - postgres-media-data:/var/lib/postgresql/data
    ports:
      - "${MEDIA_DB_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipms_media -d ipms_media"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-notification:
    image: postgres:17-alpine
    env_file:
      - ./env/notification-db.env
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    ports:
      - "${NOTIFICATION_DB_PORT:-5438}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipms_notification -d ipms_notification"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-docs:
    image: postgres:17-alpine
    env_file:
      - ./env/docs-db.env
    volumes:
      - postgres-docs-data:/var/lib/postgresql/data
    ports:
      - "${DOCS_DB_PORT:-5439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipms_docs -d ipms_docs"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  iam-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: iam }
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && pnpm exec tsx prisma/seed.main.ts"]
    env_file:
      - ./env/iam.env
    depends_on:
      postgres-iam: { condition: service_healthy }

  iam:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: iam }
    env_file:
      - ./env/iam.env
    depends_on:
      postgres-iam: { condition: service_healthy }
      nats:         { condition: service_healthy }
      redis:        { condition: service_healthy }
      iam-migrate:  { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  audit-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: audit }
    env_file:
      - ./env/audit.env
    depends_on:
      postgres-audit: { condition: service_healthy }

  audit:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: audit }
    env_file:
      - ./env/audit.env
    depends_on:
      postgres-audit: { condition: service_healthy }
      nats:           { condition: service_healthy }
      redis:          { condition: service_healthy }
      audit-migrate:  { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  project-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: project }
    env_file:
      - ./env/project.env
    depends_on:
      postgres-project: { condition: service_healthy }
      # Project's migrations drop the work orders qc-migrate copies out of
      # them, so they must not run until that copy has finished.
      qc-migrate:       { condition: service_completed_successfully }

  project:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: project }
    env_file:
      - ./env/project.env
    depends_on:
      postgres-project: { condition: service_healthy }
      nats:             { condition: service_healthy }
      redis:            { condition: service_healthy }
      project-migrate:  { condition: service_completed_successfully }

  qc-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: qc }
    env_file:
      - ./env/qc.env
    # Copies project's work orders into qc's tables once they exist; a no-op
    # once project no longer holds any. See prisma/import-project-work-orders.ts.
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && pnpm exec tsx prisma/import-project-work-orders.ts"]
    depends_on:
      postgres-qc:      { condition: service_healthy }
      postgres-project: { condition: service_healthy }

  qc:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: qc }
    env_file:
      - ./env/qc.env
    depends_on:
      postgres-qc: { condition: service_healthy }
      nats:        { condition: service_healthy }
      redis:       { condition: service_healthy }
      qc-migrate:  { condition: service_completed_successfully }

  media-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: media }
    env_file:
      - ./env/media.env
    depends_on:
      postgres-media: { condition: service_healthy }

  # Postgres only: media has no EventBus and no Redis client, so it waits on
  # neither and its env file carries no NATS_URL or REDIS_URL.
  media:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: media }
    env_file:
      - ./env/media.env
    depends_on:
      postgres-media: { condition: service_healthy }
      media-migrate:  { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3006/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  notification-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: notification }
    env_file:
      - ./env/notification.env
    depends_on:
      postgres-notification: { condition: service_healthy }

  # Postgres only: notification has no EventBus and no Redis client, so it waits on
  # neither and its env file carries no NATS_URL or REDIS_URL.
  notification:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: notification }
    env_file:
      - ./env/notification.env
    depends_on:
      postgres-notification: { condition: service_healthy }
      notification-migrate:  { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3007/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  docs-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: docs }
    env_file:
      - ./env/docs.env
    depends_on:
      postgres-docs: { condition: service_healthy }

  # Postgres only: docs has no EventBus and no Redis client, so it waits on
  # neither and its env file carries no NATS_URL or REDIS_URL.
  docs:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: docs }
    env_file:
      - ./env/docs.env
    depends_on:
      postgres-docs: { condition: service_healthy }
      docs-migrate:  { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3008/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: gateway }
    env_file:
      - ./env/gateway.env
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      nats:         { condition: service_healthy }
      redis:        { condition: service_healthy }
      iam:          { condition: service_healthy }
      audit:        { condition: service_healthy }
      project:      { condition: service_started }
      qc:           { condition: service_started }
      media:        { condition: service_healthy }
      notification: { condition: service_healthy }
      docs:         { condition: service_healthy }

  web:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    env_file:
      - ./env/web.env
    ports:
      - "${WEB_PORT:-3100}:3100"
    depends_on:
      gateway: { condition: service_started }

volumes:
  postgres-iam-data:
  postgres-audit-data:
  postgres-project-data:
  postgres-qc-data:
  postgres-media-data:
  postgres-notification-data:
  postgres-docs-data:
  nats-data:
  redis-data:
  loki-data:
