name: ipms

x-service-defaults: &service-defaults
  restart: unless-stopped
  environment: &service-env
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
    JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}

# The infrastructure every service needs before it can boot. `depends_on` is
# listed per service rather than here, because each one must additionally wait
# for its own migration container, and a merge key replaces `depends_on`
# wholesale instead of merging into it.
x-infra-ready: &infra-ready
  postgres: { condition: service_healthy }
  nats:     { condition: service_healthy }
  redis:    { condition: service_healthy }

# One-shot: applies this service's migrations and exits. The service that owns
# the database waits for it to exit 0.
x-migrate-defaults: &migrate-defaults
  restart: "no"
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  # Applies iam's migrations, then reconciles the permission catalog and the
  # system roles — reference data the platform cannot authorize anything
  # without, and which `seedIam` is written to re-apply safely every time.
  #
  # The four demo accounts are opt-in: `seed.main.ts` creates them only under
  # NODE_ENV development or test, so setting IAM_DEMO_PASSWORD is what turns
  # them on. Leave it unset and no credentials are created.
  iam-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: iam }
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && pnpm exec tsx prisma/seed.main.ts"]
    environment:
      DATABASE_URL: postgresql://ipms_iam:ipms_iam@postgres:5432/ipms_iam
      IAM_DATABASE_URL: postgresql://ipms_iam:ipms_iam@postgres:5432/ipms_iam
      NODE_ENV: ${IAM_DEMO_PASSWORD:+development}
      IAM_DEMO_PASSWORD: ${IAM_DEMO_PASSWORD:-}

  iam:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: iam }
    depends_on:
      <<: *infra-ready
      iam-migrate: { condition: service_completed_successfully }
    environment:
      <<: *service-env
      PORT: 3001
      IAM_DATABASE_URL: postgresql://ipms_iam:ipms_iam@postgres:5432/ipms_iam
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  audit-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: audit }
    environment:
      DATABASE_URL: postgresql://ipms_audit:ipms_audit@postgres:5432/ipms_audit

  audit:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: audit }
    depends_on:
      <<: *infra-ready
      audit-migrate: { condition: service_completed_successfully }
    environment:
      <<: *service-env
      PORT: 3003
      AUDIT_DATABASE_URL: postgresql://ipms_audit:ipms_audit@postgres:5432/ipms_audit
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  project-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: project }
    environment:
      DATABASE_URL: postgresql://ipms_project:ipms_project@postgres:5432/ipms_project

  project:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: project }
    depends_on:
      <<: *infra-ready
      project-migrate: { condition: service_completed_successfully }
    environment:
      <<: *service-env
      PORT: 3004
      PROJECT_DATABASE_URL: postgresql://ipms_project:ipms_project@postgres:5432/ipms_project

  qc-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: qc }
    environment:
      DATABASE_URL: postgresql://ipms_qc:ipms_qc@postgres:5432/ipms_qc

  qc:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: qc }
    depends_on:
      <<: *infra-ready
      qc-migrate: { condition: service_completed_successfully }
    environment:
      <<: *service-env
      PORT: 3005
      QC_DATABASE_URL: postgresql://ipms_qc:ipms_qc@postgres:5432/ipms_qc
      # Straight to the project service, not via the gateway: the geofence
      # lookup is under /internal/, which the gateway refuses by design.
      # Deliberately no depends_on — the lookup fails soft to UNVERIFIED, and
      # a submission must never wait on the project service being up.
      PROJECT_INTERNAL_URL: http://project:3004

  media-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: media }
    environment:
      DATABASE_URL: postgresql://ipms_media:ipms_media@postgres:5432/ipms_media

  media:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: media }
    depends_on:
      <<: *infra-ready
      media-migrate: { condition: service_completed_successfully }
    environment:
      <<: *service-env
      PORT: 3006
      MEDIA_DATABASE_URL: postgresql://ipms_media:ipms_media@postgres:5432/ipms_media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3006/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  notification-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: notification }
    environment:
      DATABASE_URL: postgresql://ipms_notification:ipms_notification@postgres:5432/ipms_notification

  notification:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: notification }
    depends_on:
      <<: *infra-ready
      notification-migrate: { condition: service_completed_successfully }
    environment:
      <<: *service-env
      PORT: 3007
      NOTIFICATION_DATABASE_URL: postgresql://ipms_notification:ipms_notification@postgres:5432/ipms_notification
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3007/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  docs-migrate:
    <<: *migrate-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      target: migrate
      args: { SERVICE: docs }
    environment:
      DATABASE_URL: postgresql://ipms_docs:ipms_docs@postgres:5432/ipms_docs

  docs:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: docs }
    depends_on:
      <<: *infra-ready
      docs-migrate: { condition: service_completed_successfully }
    environment:
      <<: *service-env
      PORT: 3008
      DOCS_DATABASE_URL: postgresql://ipms_docs:ipms_docs@postgres:5432/ipms_docs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3008/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: gateway }
    environment:
      <<: *service-env
      PORT: 3000
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      <<: *infra-ready
      iam:   { condition: service_healthy }
      audit: { condition: service_healthy }
      project: { condition: service_started }
      qc: { condition: service_started }

volumes:
  postgres-data:
  nats-data:
  redis-data:
  loki-data:
